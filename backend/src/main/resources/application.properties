spring.application.name=rental-management-system

# ---------------------------------------------------------------------------
# Default profile: H2 in-memory DB so the project runs with zero setup.
# Switch to the "mysql" profile (see application-mysql.properties) for
# a real database - just run with --spring.profiles.active=mysql
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:rentaldb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Schema is owned by Flyway (see src/main/resources/db/migration). Hibernate
# only validates that entity mappings match the migrated schema - it never
# creates or alters tables itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# JWT settings
# ---------------------------------------------------------------------------
# 256-bit base64 secret - REPLACE THIS in production (e.g. via env var jwt.secret)
jwt.secret=${JWT_SECRET:c2VjdXJlLXJhbmRvbS1qd3Qtc2VjcmV0LWtleS1mb3ItcmVudGFsLW1hbmFnZW1lbnQtc3lzdGVtLWNoYW5nZS1tZQ==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------------------
# Scheduling
# ---------------------------------------------------------------------------
spring.task.scheduling.pool.size=2

# Server
server.port=${PORT:8080}
