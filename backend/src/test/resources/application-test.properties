# Isolated H2 instance for the test suite - separate from the dev DB name
# so running tests never collides with a locally-running dev instance.
spring.datasource.url=jdbc:h2:mem:rentaldb_test;DB_CLOSE_DELAY=-1
spring.h2.console.enabled=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
